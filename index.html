<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Cartera por cobrar · Crédito y Cobranza</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="window.__XLSX_FAIL=true"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--card2:#f8f9fb;--tx:#1b1f24;--tx2:#5b6470;--tx3:#8a929c;--bd:#e2e5ea;--acc:#1f5fbf;--acc-tx:#fff;--accbg:#e8f0fc;
  --pv:#2f9e5f;--t30:#9cbf2e;--t60:#e9b01f;--t90:#e8762c;--t90p:#d23f3f;--fav:#2f7fd1;--conc:#8a5cd1;
  --alta:#d23f3f;--media:#e39a14;--baja:#2f7fd1;--altabg:#fdecec;--mediabg:#fdf4e3;--bajabg:#eaf2fc;
  --s1:#2f6fd1;--s2:#14968f;--ref:#8b95a1;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111418;--card:#1a1e24;--card2:#20252c;--tx:#e8eaed;--tx2:#a5adb8;--tx3:#78818c;--bd:#2d333b;--acc:#5b9bf0;--acc-tx:#0c1420;--accbg:#1c2a3f;
  --pv:#3fb873;--t30:#b1d143;--t60:#f0c043;--t90:#f08a45;--t90p:#ef5c5c;--fav:#4f9be8;--conc:#a27ee6;
  --alta:#ef5c5c;--media:#f0b03a;--baja:#4f9be8;--altabg:#3a1f22;--mediabg:#382d18;--bajabg:#1b2b40;
  --s1:#4a86dc;--s2:#1fa79e;--ref:#6f7a86;--sh:none;}}
:root[data-theme=dark]{
  --bg:#111418;--card:#1a1e24;--card2:#20252c;--tx:#e8eaed;--tx2:#a5adb8;--tx3:#78818c;--bd:#2d333b;--acc:#5b9bf0;--acc-tx:#0c1420;--accbg:#1c2a3f;
  --pv:#3fb873;--t30:#b1d143;--t60:#f0c043;--t90:#f08a45;--t90p:#ef5c5c;--fav:#4f9be8;--conc:#a27ee6;
  --alta:#ef5c5c;--media:#f0b03a;--baja:#4f9be8;--altabg:#3a1f22;--mediabg:#382d18;--bajabg:#1b2b40;
  --s1:#4a86dc;--s2:#1fa79e;--ref:#6f7a86;--sh:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd)}
.topin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;display:flex;flex-direction:column;line-height:1.2}
.brand small{font-weight:400;color:var(--tx2);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;background:var(--altabg);color:var(--alta);font-weight:700;cursor:pointer;font-size:14px}
.badge.ok{background:var(--card2);color:var(--tx2)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--tx2);cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:20px;background:var(--bd);position:relative;cursor:pointer;transition:.15s;margin:0;padding:0;border:0;min-height:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked{background:var(--acc)}
.switch input:checked::after{left:18px}
.iconbtn{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--tx2);font-size:13.5px}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 13px;cursor:pointer;color:var(--tx2);border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--altabg);color:var(--alta);font-size:12px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-weight:400;color:var(--tx2);font-size:13px}
.card h2 .rt{margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);min-width:0}
.kpi .lb{font-size:13px;color:var(--tx2)}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.kpi .s{font-size:12.5px;color:var(--tx3);margin-top:2px}
.dl{font-size:12.5px;font-weight:600;white-space:nowrap}
.dl.up{color:var(--alta)}.dl.dn{color:var(--pv)}.dl.up.good{color:var(--pv)}.dl.dn.good{color:var(--alta)}.dl.eq{color:var(--tx3)}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.met{background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
.met .lb{font-size:12.5px;color:var(--tx2);display:flex;gap:4px;align-items:center}
.met .lb i{font-style:normal;color:var(--tx3);cursor:help;border:1px solid var(--bd);border-radius:50%;width:15px;height:15px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.met .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.met .s{font-size:12px;color:var(--tx3)}
.agebar{display:flex;height:46px;border-radius:10px;overflow:hidden;background:var(--card2);gap:2px}
.agebar.sm{height:22px;border-radius:6px}
.agebar .seg{height:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;min-width:3px;transition:filter .1s;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.agebar .seg:hover{filter:brightness(1.08)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}
.legend button{display:flex;gap:9px;align-items:flex-start;text-align:left;background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;cursor:pointer}
.legend .sw{width:12px;height:12px;border-radius:3px;margin-top:4px;flex:none}
.legend .t{font-size:13px;color:var(--tx2)}
.legend .a{font-weight:700;font-variant-numeric:tabular-nums}
.legend .p{font-size:12.5px;color:var(--tx3)}
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.ind{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;box-shadow:var(--sh);min-width:0}
.ind .lb{font-size:13px;color:var(--tx2)}
.ind .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ind .s{font-size:12.5px;color:var(--tx3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid2>*{min-width:0}
.grid2.wide2{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media (max-width:900px){.grid2.wide2{grid-template-columns:1fr}}
.grid2>.card{margin-bottom:0}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.top8 .row{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.top8 .nm{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top8 .bar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--card2)}
.top8 .bar span{height:100%}
.top8 .bar span+span{margin-left:2px}
.top8 .am{font-weight:600;font-size:13.5px}
@media (max-width:560px){.top8 .row{grid-template-columns:1fr auto}.top8 .bar{grid-column:1/-1;order:3}}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--card2);text-align:left;font-weight:600;color:var(--tx2);white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--tx)}
tbody tr:last-child td{border-bottom:0}
tfoot th{border-bottom:0;border-top:1px solid var(--bd)}
tbody tr:hover td{background:var(--card2)}
tr.click{cursor:pointer}
td.nm{min-width:180px}
td.dc{white-space:nowrap}
td .cod{color:var(--tx3);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:#fff;background:var(--c)}
.tag.soft{background:transparent;color:var(--c);border:1px solid var(--c)}
.tag.new{background:var(--accbg);color:var(--acc)}
.sc{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.sc b{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;color:#fff;background:var(--c);font-size:12.5px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--alta)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select,.cfg input,.cfg select,.map select,.sheethd select,.sheethd input,.gform input,.gform select{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 10px;min-height:36px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--tx2)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.alert{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.alert .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert .ti{font-weight:700}
.alert .am{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.alert .ds{color:var(--tx2);font-size:13.5px}
.alert .rec{font-size:13px;font-weight:600}
.alert .ct{font-size:13px;color:var(--tx2);display:flex;gap:14px;flex-wrap:wrap}
.alert .lg{font-size:12.5px;color:var(--tx2);background:var(--card2);border-radius:8px;padding:6px 9px}
.alert .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.lvl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:6px;color:var(--c);background:var(--cb)}
.drop{border:2px dashed var(--bd);border-radius:var(--r);padding:28px 16px;text-align:center;background:var(--card);cursor:pointer;transition:.15s}
.drop.over{border-color:var(--acc);background:var(--accbg)}
.drop b{font-size:16px}
.drop p{margin:6px 0 0;color:var(--tx2);font-size:13.5px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--tx2)}
.cfg .inl{display:flex;gap:6px;align-items:center}
.cfg .inl input{flex:1}
.cfg h3{grid-column:1/-1;font-size:13.5px;margin:8px 0 0;color:var(--tx)}
.note{font-size:12.5px;color:var(--tx3)}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.msg.warn{background:var(--mediabg);color:var(--tx)}
.msg.err{background:var(--altabg);color:var(--tx)}
.msg.info{background:var(--bajabg);color:var(--tx)}
.sheet{border:1px solid var(--bd);border-radius:10px;margin-bottom:12px;background:var(--card)}
.sheethd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--card2);border-radius:10px 10px 0 0;border-bottom:1px solid var(--bd)}
.sheethd .fn{font-weight:700;margin-right:auto;word-break:break-all}
.sheethd .fn small{font-weight:400;color:var(--tx2)}
.sheethd label{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.sheethd input[type=number]{width:72px}
.sheet details summary{cursor:pointer;padding:9px 12px;font-size:13px;color:var(--tx2)}
.map td{vertical-align:middle}
.map td.ex{color:var(--tx2);font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map select{min-width:180px}
.map tr.on td:first-child{font-weight:600}
.miss{padding:8px 12px;font-size:12.5px;color:var(--alta)}
.cruces{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cruce{border:1px solid var(--bd);border-radius:10px;padding:12px;background:var(--card2)}
.cruce .t{font-weight:700;font-size:13.5px;margin-bottom:6px}
.cruce .n{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.cruce .ok{color:var(--pv);font-weight:700}
.cruce .na{color:var(--alta);font-weight:700}
.cruce .ls{font-size:12px;color:var(--tx2);margin-top:6px;word-break:break-word}
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
.empty h3{color:var(--tx);margin:0 0 6px}
.more{text-align:center;margin:12px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tip{position:fixed;z-index:98;pointer-events:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:8px;padding:7px 10px;font-size:12.5px;white-space:pre-line;max-width:260px;opacity:0;transition:opacity .08s}
.tip.show{opacity:1}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--bd);stroke-width:1}
.chart .bl{stroke:var(--tx3);stroke-width:1}
.chart .ax{fill:var(--tx3);font-size:11px;font-family:inherit}
.chart [data-tip]{cursor:pointer}
.chart rect[data-tip]:hover{filter:brightness(1.1)}
.cleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);margin:-4px 0 8px}
.cleg span{display:inline-flex;align-items:center;gap:6px}
.cleg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cleg i.ln{height:3px;border-radius:2px}
.cleg i.dash{height:0;border-top:2px dashed var(--ref);width:16px;border-radius:0}
.vtbl td,.vtbl th{white-space:nowrap}
.muted{color:var(--tx3)}
.hide{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:var(--bg);border-radius:14px;width:min(1000px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{display:flex;gap:10px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--bd);background:var(--card);border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.modal .mh h3{margin:0;font-size:18px}
.modal .mh .x{margin-left:auto}
.modal .mb{padding:16px}
.gform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.gform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--tx2)}
.gform .wide{grid-column:1/-1}
.glist{list-style:none;margin:10px 0 0;padding:0}
.glist li{border-top:1px solid var(--bd);padding:8px 0;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.glist li .w{flex:1}
@media (max-width:640px){
  main{padding:12px}.card{padding:13px}.kpi .v{font-size:22px}.brand{font-size:15.5px}
  .topin{gap:8px}.overlay{padding:0}.modal{border-radius:0;min-height:100%}.modal .mh{border-radius:0}
}
@media print{header.top,.filters,.row-btns,.alert .ac{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">Cartera por cobrar<small id="hdrSub">Sin datos cargados</small></div>
    <button class="badge ok" id="hdrBadge" data-act="tab" data-tab="alertas" title="Ver alertas urgentes"><span class="dot"></span><span id="hdrBadgeTx">0 urgentes</span></button>
    <label class="switch" title="Excluir partidas por conciliar (posibles retenciones/diferencias)"><input type="checkbox" id="swReal" data-ch="soloReal"><span>Solo deuda real</span></label>
    <button class="iconbtn" data-act="xlsx" title="Descargar reporte completo en Excel">⬇ Excel</button>
    <button class="iconbtn" data-act="theme" id="btnTheme" title="Cambiar tema claro/oscuro">Tema: auto</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="dash">Dashboard</button>
    <button data-act="tab" data-tab="tend">Tendencias y proyección</button>
    <button data-act="tab" data-tab="clientes">Clientes</button>
    <button data-act="tab" data-tab="alertas">Alertas<span class="cnt hide" id="tabCnt"></span></button>
    <button data-act="tab" data-tab="detalle">Detalle</button>
    <button data-act="tab" data-tab="carga">Carga y configuración</button>
  </nav>
</header>
<main id="main"></main>
<div id="modalRoot"></div>
<input type="file" id="fileIn" multiple accept=".xlsx,.xls,.xlsm,.csv,.txt" class="hide">
<input type="file" id="bkIn" accept=".json,application/json" class="hide">
<div class="toast" id="toast"></div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ============================================================
   Módulo de análisis de cartera por cobrar · v2
   Todo se procesa en el navegador. Nada se envía a ningún servidor.
   ============================================================ */
const LS_KEY='cxc_modulo_cartera_v1',LS_HIST='cxc_modulo_historial_v1',LS_GEST='cxc_modulo_gestiones_v1';
const DAY=86400000;
const TRAMOS=[
  {k:'pv',  l:'Por vencer',   c:'var(--pv)'},
  {k:'t30', l:'1–30 días',    c:'var(--t30)'},
  {k:'t60', l:'31–60 días',   c:'var(--t60)'},
  {k:'t90', l:'61–90 días',   c:'var(--t90)'},
  {k:'t90p',l:'Más de 90 días',c:'var(--t90p)'}];
const TR=Object.fromEntries(TRAMOS.map(t=>[t.k,t]));
const TRI={pv:0,t30:1,t60:2,t90:3,t90p:4};
const VENC_TR=['t30','t60','t90','t90p'];
const TYPES={cartera:'Cartera (documentos)',clientes:'Maestro de clientes',vendedores:'Vendedores',pagos:'Pagos / cobros',ventas:'Ventas / facturación',ignorar:'Ignorar'};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESESL=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* Números: coma o punto decimal, $, paréntesis y signo al final */
function parseNum(v,commaDec){
  if(v===''||v==null)return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1).trim()}
  s=s.replace(/US\$|USD|\$|\s| /gi,'');
  if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1)}
  if(s.startsWith('-')){neg=!neg;s=s.slice(1)}else if(s.startsWith('+'))s=s.slice(1);
  if(!/^\d[\d.,]*$/.test(s)&&!/^[.,]\d+$/.test(s))return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>=0&&ld>=0){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(lc>=0){const p=s.split(',');if(p.length>2)s=s.replace(/,/g,'');else if(!commaDec&&p[1].length===3)s=s.replace(',','');else s=s.replace(',','.')}
  else if(ld>=0){const p=s.split('.');if(p.length>2)s=s.replace(/\./g,'');else if(commaDec&&p[1].length===3)s=s.replace('.','')}
  const n=Number(s);if(!isFinite(n))return null;return neg?-n:n;
}
function detectCommaDec(vals){let c=0,d=0;for(const v of vals){if(typeof v!=='string')continue;const s=v.trim();if(/\d,\d{1,2}-?\)?$/.test(s)||/\d\.\d{3},\d/.test(s))c++;else if(/\d\.\d{1,2}-?\)?$/.test(s)||/\d,\d{3}\.\d/.test(s))d++}return c>0&&c>=d}
/* Fechas: serial Excel, Date, dd/mm/aaaa, aaaa-mm-dd, 05-nov-2026 */
function parseDate(v){
  if(v===''||v==null)return null;
  if(v instanceof Date&&!isNaN(v))return Math.round(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())/DAY);
  if(typeof v==='number'){if(v>20000&&v<80000)return Math.floor(v)-25569;return null}
  const s=String(v).trim();let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)))return mk(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/.exec(s))){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12)[d,mo]=[mo,d];return mk(y,mo,d)}
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(Number(s));
  const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
  if((m=/^(\d{1,2})[-\/ ]([a-záéíóú]{3})[a-záéíóú]*[-\/ ](\d{2,4})/i.exec(s))){const mo=MES[norm(m[2]).slice(0,3)];if(mo){let y=+m[3];if(y<100)y+=2000;return mk(y,mo,+m[1])}}
  return null;
  function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31||y<1900||y>2100)return null;return Math.round(Date.UTC(y,mo-1,d)/DAY)}
}

/* ---------- Detección de encabezados, clasificación y mapeo ---------- */
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* Encabezados con tildes dañadas (p. ej. "Raz罅Social", "C?igo", "L刎ite de"): comparación aproximada */
const hdrInfo=raw=>{const r=String(raw??'');const n=norm(r);const fz=/[^\x00-\u024F\u2018-\u201F]|\?/.test(r);return {n,c:fz?n.replace(/ /g,''):null}};
function score(h,syns,c){let b=0;for(const s of syns){if(h===s)return 3;if((' '+h+' ').includes(' '+s+' '))b=2}
  if(c){for(const s of syns){const sc=s.replace(/ /g,'');if(sc.length<5||Math.abs(sc.length-c.length)>2)continue;const lim=sc.length>=7?2:1;if(lev(c,sc)<=lim){const v=sc.length>=7?3:2;if(v>b)b=v}}}
  return b}
function detectHeader(rows){
  let best=-1,bi=0;const lim=Math.min(rows.length,40);
  for(let i=0;i<lim;i++){const r=rows[i]||[];let m=0,txt=0;
    for(const c of r){if(typeof c==='string'&&c.trim()){txt++;const hi=hdrInfo(c);if(score(hi.n,ALLSYN,hi.c)>=2)m++}}
    const sc=m*10+Math.min(txt,8);if(m>=2&&sc>best){best=sc;bi=i}}
  if(best<0){for(let i=0;i<lim;i++){const r=rows[i]||[];if(r.filter(c=>typeof c==='string'&&c.trim()).length>=3)return i}}
  return bi;
}
const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};

}
function autoMap(headers,type){
  const map={};const fs=FIELDS[type]||[];const cand=[];
  const nh=headers.map(h=>h.startsWith('(sin título')?{n:''}:hdrInfo(h));
  fs.forEach((f,pi)=>nh.forEach((h,ci)=>{if(!h.n)return;const sc=score(h.n,f.s,h.c);if(sc)cand.push([sc,pi,ci,f.k])}));
  cand.sort((a,b)=>b[0]-a[0]||a[1]-b[1]||a[2]-b[2]);
  const used=new Set();for(const [,,ci,k] of cand){if(map[k]!=null||used.has(ci))continue;map[k]=ci;used.add(ci)}
  return map;
}
function classify(headers,fname,sname){
  const hint=norm(fname+' '+sname);const res={};const hn=headers.map(norm);
  const hdrHas=re=>hn.some(h=>re.test(h));
  const carSaldo=autoMap(headers,'cartera').saldo!=null;
  for(const t of ['cartera','clientes','vendedores','pagos','ventas']){
    const m=autoMap(headers,t);const has=k=>m[k]!=null?1:0;let s=0;
    if(t==='cartera'){if(has('saldo')&&(has('doc')||has('venc')||has('dias')))s=3+2*has('venc')+2*has('dias')+has('doc')+has('imp')+has('tipo')+has('fdoc')+has('cli');if(/cartera|cxc|por cobrar|antiguedad|saldos/.test(hint))s+=2}
    if(t==='clientes'){if(has('cli')||has('nom'))s=3*has('limite')+2*has('plazo')+2*has('tel')+2*has('correo')+has('cli')+has('nom');if(carSaldo)s-=3;if(/client|maestro|partner|socio/.test(hint))s+=2}
    if(t==='vendedores'){if(has('ven')&&has('vnom'))s=2+(headers.length<=4?1:0)+(hdrHas(/vend|repre|asesor/)?2:0)+(/vend|repre|asesor/.test(hint)?2:0);if(autoMap(headers,'clientes').limite!=null)s-=3}
    if(t==='pagos'){if(has('monto')&&has('fpago'))s=2+2*has('doc')+(hdrHas(/pago|cobro|abono|recaud|deposit/)?3:0)+(/pago|cobro|abono|recaud/.test(hint)?3:0);if(carSaldo)s-=5}
    if(t==='ventas'){if(has('imp')&&has('fdoc'))s=2+has('doc')+2*has('venc')+has('cli');if(hdrHas(/pago|cobro|abono|recaud/))s-=3;if(/venta|factur/.test(hint))s+=3;if(carSaldo)s-=5}
    res[t]=s;
  }
  let bt='ignorar',bs=2;for(const [t,s] of Object.entries(res))if(s>bs){bs=s;bt=t}
  return bt;
}
const sigOf=h=>{let x=5381;const s=h.map(norm).join('|');for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return 'h'+(x>>>0).toString(36)+'_'+h.length};

function parseCSV(text){
  const first=text.split(/\r?\n/).slice(0,10).join('\n');
  const cnt=ch=>first.split(ch).length-1;
  const d=[';',',','\t','|'].map(c=>[c,cnt(c)]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
async function readFile(file){
  const name=file.name;const ext=(name.split('.').pop()||'').toLowerCase();
  const buf=await file.arrayBuffer();
  if(ext==='csv'||ext==='txt'){
    let text=new TextDecoder('utf-8').decode(buf);
    if(text.includes('�')){try{text=new TextDecoder('windows-1252').decode(buf)}catch(e){}}
    text=text.replace(/^﻿/,'');
    return {id:uid(),name,sheets:[buildSheet(name,'CSV',parseCSV(text))]};
  }
  if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector de Excel (SheetJS). Se necesita conexión a internet la primera vez que se abre la página. Mientras tanto puede guardar el archivo como CSV.');
  const wb=XLSX.read(buf,{type:'array',cellDates:false,cellText:false,cellNF:false});
  const sheets=[];
  for(const sn of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:'',blankrows:false});
    if(!rows.length)continue;sheets.push(buildSheet(name,sn,rows));
  }
  if(!sheets.length)throw new Error('El archivo no tiene hojas con datos.');
  return {id:uid(),name,sheets};
}

/* ---------- Mensaje de cobranza ---------- */
function cobroMsg(c){
  const ven=c.docs.filter(d=>d.incl&&!d.conc&&d.dias>0).sort((a,b)=>b.dias-a.dias);
  const px=c.docs.filter(d=>d.incl&&!d.conc&&d.dias!=null&&d.dias<=0&&d.dias>=-R.prox).sort((a,b)=>a.venc-b.venc);
  const conc=c.docs.filter(d=>d.conc);const fav=c.docs.filter(d=>d.fav);
  const L=[];
  L.push(`Estimados señores de ${c.nom}:`,'');
  L.push(`Reciban un cordial saludo. Por medio del presente nos permitimos informarles que, según nuestros registros con corte al ${fdate(R.corte)}, su cuenta presenta los siguientes documentos pendientes de pago:`,'');
  const line=d=>`• ${d.tipo&&!/^j80$/i.test(d.tipo)?d.tipo+' ':''}N.° ${d.doc||'s/n'}${d.fdoc!=null?', emitido el '+fdate(d.fdoc):''}${d.venc!=null?', vence el '+fdate(d.venc):''}`;
  if(ven.length){L.push('DOCUMENTOS VENCIDOS');ven.forEach(d=>L.push(`${line(d)} (${d.dias} días de vencido): USD ${NF.format(d.saldo)}`));L.push(`Total vencido: USD ${NF.format(sum(ven,d=>d.saldo))}`,'')}
  if(px.length){L.push('DOCUMENTOS PRÓXIMOS A VENCER');px.forEach(d=>L.push(`${line(d)} (${d.dias===0?'vence hoy':'en '+(-d.dias)+' días'}): USD ${NF.format(d.saldo)}`));L.push(`Total próximo a vencer: USD ${NF.format(sum(px,d=>d.saldo))}`,'')}
  if(!ven.length&&!px.length)L.push('No registramos documentos vencidos ni próximos a vencer.','');
  L.push(`Saldo total de su cuenta: USD ${NF.format(c.tot)}`,'');
  if(conc.length)L.push(`Adicionalmente, registramos ${conc.length} saldo(s) menor(es) por USD ${NF.format(sum(conc,d=>d.saldo))} (documentos ${conc.slice(0,8).map(d=>d.doc||'s/n').join(', ')}${conc.length>8?'…':''}) que podrían corresponder a retenciones. Si es el caso, les agradeceremos enviarnos los comprobantes de retención para su registro.`,'');
  if(fav.length)L.push(`Mantienen a su favor USD ${NF.format(-sum(fav,d=>d.saldo))} en nota(s) de crédito pendiente(s) de aplicar (${fav.slice(0,8).map(d=>d.doc||'s/n').join(', ')}), que podemos cruzar contra los documentos pendientes.`,'');
  if(c.promInc)L.push(`Les recordamos el compromiso de pago acordado para el ${fdate(c.prom.pf)}, que a la fecha no registramos.`,'');
  L.push('Les agradeceremos gestionar el pago a la brevedad posible. Si ya realizaron el pago, por favor háganos llegar el comprobante para aplicarlo a su cuenta.','');
  L.push('Atentamente,',S.cfg.firma||'Departamento de Crédito y Cobranza');
  return L.join('\n');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
const waPhone=t=>{let d=String(t||'').split(/[\/,;]/)[0].replace(/\D/g,'');if(!d)return '';if(d.startsWith('593'))return d;if(d.startsWith('0'))d=d.slice(1);return d.length>=8?'593'+d:''};

  if(a==='copy'){copyText(t).then(ok=>toast(ok?'Mensaje copiado al portapapeles.':'No se pudo copiar; su navegador lo bloqueó.'))}
  else if(a==='wa'){window.open('https://wa.me/'+waPhone(c.tel)+'?text='+encodeURIComponent(t),'_blank','noopener')}

}

/* ---------- Notificaciones ---------- */
async function enableNotif(){
  if(!('Notification' in window)){toast('Este navegador no admite notificaciones.');return}
  try{let p=Notification.permission;if(p!=='granted')p=await Notification.requestPermission();
    if(p==='granted'){S.cfg.notif=true;UI.lastNotif=-1;save();notify(true);toast('Notificaciones activadas.')}
    else{S.cfg.notif=false;save();toast('Permiso de notificaciones denegado. Puede habilitarlo en la configuración del navegador.')}
  }catch(e){toast('No fue posible activar las notificaciones en este navegador.')}
  render();
}
function notify(force){
  if(!S.cfg.notif||!R||!R.urg)return;
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(!force&&R.urg===UI.lastNotif)return;UI.lastNotif=R.urg;
    const top=R.AL.filter(a=>a.lvl==='alta').slice(0,3).map(a=>(a.c?a.c.nom:'')+' '+fmt(a.am)).join(' · ');
    new Notification(`Cartera: ${R.urg} alerta(s) urgente(s)`,{body:top,tag:'cxc-urg'});
  }catch(e){}
}

function niceMax(v){if(!(v>0))return 1;const st=v/4;const e=Math.pow(10,Math.floor(Math.log10(st)));const f=st/e;const n=[1,1.5,2,2.5,3,4,5,6,8,10].find(x=>f<=x+1e-9);return n*e*4}

  let g='';for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v).toFixed(1);g+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" class="gl"/><text x="${ml-6}" y="${(+yy+4)}" class="ax" text-anchor="end">${fmtK(v)}</text>`}
  const bw=pw/n,gap=Math.max(2,Math.min(10,bw*.22)),inner=bw-gap,sw=o.stack?inner:Math.max(1,(inner-(ns-1)*2)/ns);
  const every=Math.max(1,Math.ceil(n/Math.floor(pw/(W<500?42:54))));let bars='';
  o.labels.forEach((lb,i)=>{const x0=ml+i*bw+gap/2;let acc=0;

      if(o.stack){x=x0;yt=y(acc+v);h=y(acc)-y(acc+v)-(acc>0?2:0);acc+=v}else{x=x0+si*(sw+2);yt=y(v);h=y(0)-yt}

      bars+=`<rect x="${x.toFixed(1)}" y="${yt.toFixed(1)}" width="${sw.toFixed(1)}" height="${Math.max(.5,h).toFixed(1)}" rx="${Math.min(3,sw/3).toFixed(1)}" style="fill:${s.color}" data-tip="${esc(tip)}"/>`});

}

      <div class="tblwrap" style="margin:0 12px 12px"><table class="map"><thead><tr><th>Columna del archivo</th><th>Ejemplos</th><th>Se interpreta como</th></tr></thead><tbody>

  const L=c.loss;

    if(!nota&&pf==null){toast('Escriba un comentario o una promesa de pago.');return}
    (S.gest[k]||(S.gest[k]=[])).push({id:uid(),f,tipo:$('#gT').value,nota,pf,pm:pm||null});recalc();toast('Gestión registrada.')}
  else if(a==='gdel'){const k=b.dataset.k;if(!confirm('¿Eliminar esta gestión?'))return;S.gest[k]=(S.gest[k]||[]).filter(g=>g.id!==b.dataset.id);if(!S.gest[k].length)delete S.gest[k];recalc()}
  else if(a==='notif')enableNotif();
  else if(a==='notifoff'){S.cfg.notif=false;save();render();toast('Notificaciones desactivadas.')}
  else if(a==='copy'||a==='wa'||a==='mail'){const al=R.AL[+b.dataset.i];if(al&&al.c)contactAct(a,al.c)}
});

/* Tooltips */
const tipEl=$('#tip');let tipHold=0;
function showTip(el,x,y){const t=el.getAttribute('data-tip');if(!t)return;tipEl.textContent=t;tipEl.classList.add('show');const r=tipEl.getBoundingClientRect();let L=x+14,Tp=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(Tp+r.height>innerHeight-8)Tp=y-r.height-14;tipEl.style.left=Math.max(6,L)+'px';tipEl.style.top=Math.max(6,Tp)+'px'}
document.addEventListener('mousemove',e=>{if(Date.now()<tipHold)return;const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else tipEl.classList.remove('show')});
document.addEventListener('touchstart',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const t=e.touches[0];showTip(el,t.clientX,t.clientY);tipHold=Date.now()+2500;setTimeout(()=>tipEl.classList.remove('show'),2500)}},{passive:true});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.right,r.bottom)}});
document.addEventListener('scroll',()=>tipEl.classList.remove('show'),true);

/* ---------- Datos de ejemplo (ficticios, simulación de 24 meses) ---------- */
async function loadDemo(){await READY;
  let seed=20261121;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const hoy=todayDay();const r2=n=>Math.round(n*100)/100;const cm=n=>n.toFixed(2).replace('.',',');
  const cmT=n=>{const [i,dd]=Math.abs(n).toFixed(2).split('.');return (n<0?'-':'')+i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+dd};
  const vend=[['V01','María Fernanda Salazar'],['V02','Carlos Andrade'],['V03','Diana Morales'],['V04','Jorge Villacís']];
  const cli=[['C0101','Ferretería Los Andes',0.2,'V01',5000,30],['C0102','Comercial Pacífico Cía. Ltda.',0.55,'V02',8000,45],['C0103','Distribuidora El Sol',0.1,'V01',12000,30],['C0104','Supermercado La Floresta',0.35,'V03',15000,60],['C0105','Agrícola Río Guayas S.A.',0.85,'V02',6000,30],['C0106','Panadería San Blas',0.15,'V04',1500,15],['C0107','Constructora Cumbre',0.7,'V03',20000,60],['C0108','Textiles del Norte',0.3,'V04',4000,30],['C0109','Bazar Quitumbe',0.5,'V01',2500,30],['C0110','Importadora Costa Azul',0.25,'V02',18000,45],['C0111','Hotel Mirador del Valle',0.05,'V03',7000,30],['C0112','Restaurante El Fogón',0.9,'V04',3000,15],['C0113','Librería Central',0.4,'V01',2000,30],['C0114','Minimarket Las Palmas',0.6,'V05',0,30]];
  const inv=[];const pays=[];let nd=1000;
  for(const [cod,nom,risk,ven,lim,pl] of cli){
    const size=(lim||2500)/5;const trend=1+(rnd()-.4)*.5;
    for(let m=23;m>=0;m--){
      const k=1+Math.floor(rnd()*3);
      for(let j=0;j<k;j++){
        const fd=hoy-m*30-Math.floor(rnd()*30);if(fd>hoy)continue;
        const seas=1+.25*Math.sin((new Date(fd*DAY).getUTCMonth()+1)/12*2*Math.PI);
        const imp=r2((size*(.3+rnd()*.9))*seas*(1+(23-m)/23*(trend-1)));const vc=fd+pl;nd+=1+Math.floor(rnd()*9);
        const doc='001-002-'+String(nd).padStart(9,'0');inv.push({cod,nom,ven,fd,vc,imp,doc});
        const lateRisk=m<6?risk*1.25:risk;
        if(risk>0.8&&rnd()<.1)continue;
        const delay=Math.round(lateRisk*58-6+(rnd()-.5)*22);const pd=vc+delay;
        const r=rnd();
        if(r<.3){pays.push({doc,cod,f:pd,m:r2(imp*.9)});if(rnd()>(m<4?.6:.12))pays.push({doc,cod,f:pd+15+Math.floor(rnd()*20),m:r2(imp-r2(imp*.9))})}
        else if(r<.38){pays.push({doc,cod,f:pd,m:r2(imp*.5)});pays.push({doc,cod,f:pd+30,m:r2(imp-r2(imp*.5))})}
        else pays.push({doc,cod,f:pd,m:imp});
      }}}
  const paidTo=(doc,E)=>sum(pays.filter(p=>p.doc===doc&&p.f<=E),p=>p.m);
  const pmap=new Map();for(const p of pays){const a=pmap.get(p.doc)||[];a.push(p);pmap.set(p.doc,a)}
  const balAt=(iv,E)=>r2(iv.imp-sum((pmap.get(iv.doc)||[]).filter(p=>p.f<=E),p=>p.m));
  /* Archivo de cartera (formato del sistema) */
  const cart=[['EMPRESA DEMO S.A.'],['REPORTE DE CARTERA POR COBRAR'],['Corte al: '+fdate(hoy)],[],
    ['Código','Nombre Cliente','Repre.','Fecha Doc.','Vencimiento','Cob','Pendiente','Colum','Doc','Importe','Saldo','transacción','Bancaria','','aplicada']];
  for(const [cod,nom,,ven] of cli){
    const ivs=inv.filter(i=>i.cod===cod&&balAt(i,hoy)>0.005);
    for(const i of ivs){const s=balAt(i,hoy);cart.push([cod,nom,ven,fdate(i.fd),fdate(i.vc),'',String(hoy-i.vc),'J80',i.doc,i.imp>=1000?cmT(i.imp):cm(i.imp),s>=1000?cmT(s):cm(s),'FAC','','REF-'+(1000+i.doc.slice(-3)%997),'N'])}
    if(rnd()<.4){const v=r2(15+rnd()*180);nd+=3;cart.push([cod,nom,ven,fdate(hoy-20-Math.floor(rnd()*60)),'','','0','79N','NC-'+String(nd).padStart(6,'0'),'-'+cm(v),'-'+cm(v),'NCR','','','N'])}
    if(ivs.length)cart.push(['','Total '+nom,'','','','','','','','','','','','','']);
  }
  cart.push([],['','TOTAL GENERAL','','','','','','','','','','','','','']);
  const mae=[['Código Cliente','Razón Social','Límite de Crédito','Plazo (días)','Teléfono','Correo electrónico','Vendedor']];
  cli.filter(c=>c[0]!=='C0114').forEach(([cod,nom,,ven,lim,pl])=>mae.push([cod,nom,lim,pl,'09'+String(80000000+Math.floor(rnd()*19999999)).slice(0,8),'cobranzas@'+norm(nom).split(' ')[0]+'.ejemplo.com',ven]));
  const venT=[['Código','Nombre'],...vend];
  const pag=[['Documento','Fecha de pago','Valor pagado','Cliente'],...pays.filter(p=>p.f<=hoy).sort((a,b)=>a.f-b.f).map(p=>[p.doc,fdate(p.f),cm(p.m),p.cod])];
  const vts=[['Fecha','Cliente','Documento','Total','Vencimiento'],...inv.map(i=>[i.fd+25569,i.cod,i.doc,i.imp,i.vc+25569])];
  S.files=S.files.filter(f=>!f.demo);
  const F=(name,sn,rows)=>({id:uid(),demo:1,name,sheets:[buildSheet(name,sn,rows)]});
  S.filesDirty=true;S.files.push(F('Cartera_ejemplo.xlsx','Cartera',cart),F('Maestro_clientes_ejemplo.xlsx','Clientes',mae),F('Vendedores_ejemplo.csv','CSV',venT),F('Pagos_ejemplo.csv','CSV',pag),F('Ventas_ejemplo.xlsx','Facturas',vts));
  /* Historial: cierres de los últimos 12 meses reconstruidos de la simulación */
  S.hist=S.hist.filter(h=>h.src!=='demo');const hk=mKey(hoy);
  for(let i=12;i>=1;i--){const E=mEnd(mAdd(hk,-i));const list=[];for(const iv of inv){if(iv.fd>E)continue;const s=balAt(iv,E);if(s>0.005)list.push({k:keyOf(iv.cod),nom:iv.nom,saldo:s,imp:iv.imp,venc:iv.vc})}upsertSnap(aggSnap(list,E,S.cfg,'demo'))}
  /* Gestiones de ejemplo */
  for(const k of Object.keys(S.gest)){S.gest[k]=S.gest[k].filter(g=>!g.demo);if(!S.gest[k].length)delete S.gest[k]}
  const g=(cod,f,tipo,nota,pf,pm)=>{const k=keyOf(cod);(S.gest[k]||(S.gest[k]=[])).push({id:uid(),demo:1,f,tipo,nota,pf,pm})};
  g('C0105',hoy-12,'Llamada','Habló con el gerente; ofrece abonar la factura más antigua',hoy-4,1500);
  g('C0112',hoy-3,'WhatsApp','Confirma pago parcial por transferencia',hoy+3,800);
  g('C0107',hoy-6,'Visita','Reunión con tesorería, solicitan 15 días adicionales',null,null);
  S.cfg.corte='';UI.tab='carga';UI.open={};recalc();toast('Datos de ejemplo cargados (ficticios, 24 meses simulados).');
}
